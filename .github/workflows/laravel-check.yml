name: Laravel Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: fileinfo, zip

      - name: Install Dependencies
        run: composer install